    inset: 0;
    background: rgba(10,10,20,0.96);

    padding: 24px;
    overflow: auto;
    z-index: 9999;

    font-weight: 600;
    color: #fca5a5;
    margin-bottom: 10px;

    color: #6b7280;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 6px;

    padding: 10px 12px;
    border-radius: 6px;

      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 22px;
      border-radius: 12px;
      background: rgba(15, 15, 25, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      font: 13px/1.5 system-ui, -apple-system, sans-serif;
      text-align: center;
      max-width: 78vw;

      border: 0;
      color: #64748b;
      font: 11px system-ui, -apple-system, sans-serif;
      text-decoration: underline;

  // ─── Install ─────────────────────────────────────────────────────────────────
  window.Sim = Sim;
})();

  <script>
    /* postMessage controller */
    (function() {
  'use strict';
  window.addEventListener('message', function(e) {
    const msg = e.data;
    if (!msg || typeof msg.type !== 'string') return;
    if (msg.type !== 'UPDATE_PARAMS') return;
    try {
      if (window.params && typeof window.params === 'object' && msg.params) {
        Object.assign(window.params, msg.params);
      }
    } catch(err) {
      window.parent.postMessage({ type: 'SIMULATION_ERROR', error: err.message, stage: 'param' }, '*');
    }
  });
})();
  </script>

  <script>
    /* Global error reporter — catches sketch parse / top-level runtime errors
       so we don't lose them when the sketch runs outside an IIFE (as below).   */
    window.__pcInitFailed = false;
    window.addEventListener('error', function (ev) {
      window.__pcInitFailed = true;
      var el = document.getElementById('_pc_error');
      if (el) {
        el.style.display = 'block';
        el.innerHTML = window.__pcErrorHTML
          ? window.__pcErrorHTML('Script error', ev.error || { message: ev.message, stack: '' })
          : '<h4>⚠️ Script error</h4><div>' + String(ev.message) + '</div>';
      }
      try {
        window.parent.postMessage({
          type: 'SIMULATION_ERROR',
          error: ev.message,
          stack: ev.error && ev.error.stack,
          stage: 'init',
        }, '*');
      } catch (_) {}
    });
  </script>

    /*__PC_SKETCH__*/
